services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.4.0 # 
    container_name: mealie
    restart: always
    ports:
        - "9925:9000" # 
    deploy:
      resources:
        limits:
          memory: 512M # 
    volumes:
      - /home/kcn/docker/mealie/data:/app/data/
    environment:
      ALLOW_SIGNUP: "false"
      TZ: Europe/Warsaw
      BASE_URL: http://mealie.kcn.lan

      DB_ENGINE: sqlite # Optional: 'sqlite', 'postgres'
      # =====================================
      # Postgres Config
      # POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_SERVER: postgres
      # POSTGRES_PORT: 5432
      # POSTGRES_DB: ${POSTGRES_DB}

volumes:
  mealie-data:
    driver: local