- Usługi:
    - Portainer:
        icon: portainer #portainer.svg
        href:  "{{HOMEPAGE_VAR_PORTAINER_URL}}" 
        description: docker
        #server: debian.serwer
        #container: Portainer
        siteMonitor: "{{HOMEPAGE_VAR_PORTAINER_URL}}"
        statusStyle: 'dot'
        widget:
            type: portainer
            url:  "{{HOMEPAGE_VAR_PORTAINER_URL}}" 
            env: 3
            key:  "{{HOMEPAGE_VAR_PORTAINER_API_KEY}}" 
    - AdGuard:
        icon: adguard-home.svg
        href: "{{HOMEPAGE_VAR_ADGUARD_URL_2}}"
        description: dns
        siteMonitor: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
        statusStyle: 'dot'
        widget:
            type: adguard
            url: "{{HOMEPAGE_VAR_ADGUARD_URL}}"
            username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
            password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
 
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href:  "{{HOMEPAGE_VAR_UPTIME_KUMA_URL_2}}" 
        description: server monitor
        siteMonitor: "{{HOMEPAGE_VAR_UPTIME_KUMA_URL}}"
        statusStyle: 'dot'
        #widget:
        #   type: uptimekuma
        #   url:  "{{HOMEPAGE_VAR_UPTIME_KUMA_URL}}"
        #   slug: kcn
    - Caddy:
        icon: caddy.svg
        href: "{{HOMEPAGE_VAR_CADDY_URL_2}}"
        description: reverse proxy
        siteMonitor: "{{HOMEPAGE_VAR_CADDY_URL_2}}"
        statusStyle: 'dot'
        allowInsecure: true
#        widget:
 #           type: caddy
  #          url: "{{HOMEPAGE_VAR_CADDY_URL}}"
    - Duplicati:
        icon: duplicati
        href: "{{HOMEPAGE_VAR_DUPLICATI_URL_2}}"
        description: backup client
        ping: "{{HOMEPAGE_VAR_DUPLICATI_URL}}"
        statusStyle: 'dot'
    - ntfy:
        icon: ntfy.png
        href: "{{HOMEPAGE_VAR_NTFY_URL}}"
        description: server notifications
        ping: "{{HOMEPAGE_VAR_NTFY_URL}}"
        statusStyle: 'dot'
        # widget:
         #  url: "{{HOMEPAGE_VAR_NTFY_URL}}"
         #   topic: "{{HOMEPAGE_VAR_NTFY_TOPIC}}"  
         #   fields: ["message", "lastReceived"]
         #   username: "{{HOMEPAGE_VAR_NTFY_USERNAME}}" 
         #   password: "{{HOMEPAGE_VAR_NTFY_PASSWORD}}"
    - Semaphore:
        icon: semaphore
        href: "{{HOMEPAGE_VAR_SEMAPHORE_URL_2}}"
        description: ansible
        ping: "{{HOMEPAGE_VAR_SEMAPHORE_URL}}"
        statusStyle: 'dot'
    - Gitea:
         icon: gitea
         href: "{{HOMEPAGE_VAR_GITEA_URL_2}}"
         description: git
         ping: "{{HOMEPAGE_VAR_GITEA_URL}}"
         statusStyle: 'dot'

- Media:

     - Jellyfin:
        icon: jellyfin.svg
        href: "{{HOMEPAGE_VAR_JELLYFIN_URL_2}}"
        description: media center
        ping: "{{HOMEPAGE_VAR_JELLYFIN_URL_2}}"
        statusStyle: 'dot'
        widget:
            type: jellyfin
            url: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
            key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
            enableBlocks: true
            enableNowPlaying: true
            fields: ["movies", "series", "episodes"]

     - Jellyseerr:
        icon: jellyseerr.png
        href: "{{HOMEPAGE_VAR_JELLYSEERR_URL}}"
        description: media requests
        ping: "{{HOMEPAGE_VAR_JELLYSEERR_URL}}"
        statusStyle: 'dot'
        widget:
            type: jellyseerr
            url: "{{HOMEPAGE_VAR_JELLYSEERR_URL}}"
            key: "{{HOMEPAGE_VAR_JELLYSEERR_API_KEY}}"
            fields: ["pending", "approved", "available", "completed", "processing"]

     - Immich:
         icon: immich
         href: "{{HOMEPAGE_VAR_IMMICH_URL}}"
         description: photo library
         ping: "{{HOMEPAGE_VAR_IMMICH_URL}}"
         statusStyle: 'dot'
         widget:
            type: immich
            url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
            key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
            version: 2 
            fields: ["photos", "videos", "storage"]
     - qBittorrent:
         icon: qbittorrent.svg
         href: "{{HOMEPAGE_VAR_QBITT_URL}}"
         description: torrent client
         ping: "{{HOMEPAGE_VAR_QBITT_URL}}"
         statusStyle: 'dot'
         widget:
             type: qbittorrent
             hideErrors: true
             url: "{{HOMEPAGE_VAR_QBITT_URL}}"
             username: "{{HOMEPAGE_VAR_QBITT_USERNAME}}"
             password: "{{HOMEPAGE_VAR_QBITT_PASSWORD}}"
     - Trilium:
         icon: trilium
         href: "{{HOMEPAGE_VAR_TRILIUM_URL_2}}"
         description: notes
         ping: "{{HOMEPAGE_VAR_TRILIUM_URL}}"
         statusStyle: 'dot'
        # widget:
        #    type: trilium
        #    url: "{{HOMEPAGE_VAR_TRILIUM_URL}}"
        #    key: "{{HOMEPAGE_VAR_TRILIUM_KEY}}"

     - Mealie:
         icon: mealie
         href: "{{HOMEPAGE_VAR_MEALIE_URL_2}}"
         description: recipe manager
         ping: "{{HOMEPAGE_VAR_MEALIE_URL}}"
         statusStyle: 'dot'
             
