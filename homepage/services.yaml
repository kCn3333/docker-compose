- Media:
     - Immich:
         icon: immich
         href: "{{HOMEPAGE_VAR_IMMICH_URL}}"
         description: photo library
         ping: "{{HOMEPAGE_VAR_IMMICH_URL}}"
         statusStyle: 'dot'
         widget:
            type: immich
            url: "{{HOMEPAGE_VAR_IMMICH_URL}}"
            key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
            version: 2                                  # for Immich >= v1.118
            fields: ["photos", "videos", "storage"]
     - qBittorrent:
         icon: qbittorrent.svg
         href: "{{HOMEPAGE_VAR_QBITT_URL_2}}"
         description: torrent client
         ping: "{{HOMEPAGE_VAR_QBITT_URL_2}}"
         statusStyle: 'dot'
         widget:
             type: qbittorrent
             hideErrors: true
             url: "{{HOMEPAGE_VAR_QBITT_URL_2}}"
             username: "{{HOMEPAGE_VAR_QBITT_USERNAME}}"
             password: "{{HOMEPAGE_VAR_QBITT_PASSWORD}}"
