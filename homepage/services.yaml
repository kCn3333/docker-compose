- home.serwer:
    - "":
        description: "Debian GNU/Linux 13 (trixie) x86_64"
        ping: 192.168.0.46

    - Home Assistant:
        icon: home-assistant.png
        href: "{{HOMEPAGE_VAR_HOMEASSISTANT_URL}}"
        #description: Smart Home
        ping: "{{HOMEPAGE_VAR_HOMEASSISTANT_URL}}"
        statusStyle: 'dot'
        widget:
          type: homeassistant
          url: "{{HOMEPAGE_VAR_HOMEASSISTANT_URL}}"
          key: "{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}"
          custom:
            - template: "{{ (states('sensor.energy_monitor_switch_moc') | float(0) + states('sensor.energy_monitor_switch_2_moc') | float(0) + states('sensor.energy_monitor_switch_3_moc') | float(0)) | round(1) }} W"
              label: "Zużycie prądu"
            - state: sensor.temp2_indoor_temperatura
              label: "Temp dom"
            - template: "{{ states('sensor.rack_fan_controller_03_temp_max') | float(0) | round(2) }} °C"
              label: "Temp rack"
            - template: "{{ 'ON' if states('fan.rack_fan_controller_40_fan_top') == 'on' else 'OFF' }}"
              label: "Wentylatory"    



    #- "":
    #- "":
       # widget:
        #    type: coinmarketcap
         #   currency: PLN # Set the currency to Polish Zloty
          #  symbols: [BTC, ETH] # Example cryptocurrencies
           # key: 1a310ffd-5ad9-48ee-85be-528e8342ca23
