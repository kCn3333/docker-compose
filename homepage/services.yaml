- Usługi:
    - Portainer:
        icon: portainer #portainer.svg
        href:  "{{HOMEPAGE_VAR_PORTAINER_URL}}" 
        description: docker
        #server: debian.serwer
        #container: Portainer
        siteMonitor: "{{HOMEPAGE_VAR_PORTAINER_URL}}"
        statusStyle: 'dot'
        widget:
            type: portainer
            url:  "{{HOMEPAGE_VAR_PORTAINER_URL}}" 
            env: 2
            key:  "{{HOMEPAGE_VAR_PORTAINER_API_KEY}}" 
    - piHole:
        icon: pi-hole.svg
        href:  "{{HOMEPAGE_VAR_PIHOLE_URL_2}}" 
        description: dns
        siteMonitor: "{{HOMEPAGE_VAR_PIHOLE_URL}}"
        statusStyle: 'dot'  
        widget:
            type: pihole
            url:  "{{HOMEPAGE_VAR_PIHOLE_URL}}"
            version: 6                              # required if running v6 or higher, defaults to 5
            key:  "{{HOMEPAGE_VAR_PIHOLE_API_KEY_1}}"  
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href:  "{{HOMEPAGE_VAR_UPTIME_KUMA_URL_2}}" 
        description: server monitor
        siteMonitor: "{{HOMEPAGE_VAR_UPTIME_KUMA_URL}}"
        statusStyle: 'dot'
        #widget:
        #   type: uptimekuma
        #   url:  "{{HOMEPAGE_VAR_UPTIME_KUMA_URL}}"
        #   slug: kcn
    - Nginx:
        icon: nginx-proxy-manager.svg
        href: "{{HOMEPAGE_VAR_NGINX_URL_2}}"
        description: proxy manager
        siteMonitor: "{{HOMEPAGE_VAR_NGINX_URL}}"
        statusStyle: 'dot'
    - Duplicati:
        icon: duplicati
        href: "{{HOMEPAGE_VAR_DUPLICATI_URL_2}}"
        description: backup client
        ping: "{{HOMEPAGE_VAR_DUPLICATI_URL}}"
        statusStyle: 'dot'
    - ntfy:
        icon: ntfy.png
        href: "{{HOMEPAGE_VAR_NTFY_URL}}"
        description: server notifications
        ping: "{{HOMEPAGE_VAR_NTFY_URL}}"
        statusStyle: 'dot'
        # widget:
         #  url: "{{HOMEPAGE_VAR_NTFY_URL}}"
         #   topic: "{{HOMEPAGE_VAR_NTFY_TOPIC}}"  
         #   fields: ["message", "lastReceived"]
         #   username: "{{HOMEPAGE_VAR_NTFY_USERNAME}}" 
         #   password: "{{HOMEPAGE_VAR_NTFY_PASSWORD}}"
    - Semaphore:
        icon: semaphore
        href: "{{HOMEPAGE_VAR_SEMAPHORE_URL_2}}"
        description: ansible
        ping: "{{HOMEPAGE_VAR_SEMAPHORE_URL}}"
        statusStyle: 'dot'
    - Gitea:
         icon: gitea
         href: "{{HOMEPAGE_VAR_GITEA_URL_2}}"
         description: git
         ping: "{{HOMEPAGE_VAR_GITEA_URL}}"
         statusStyle: 'dot'

