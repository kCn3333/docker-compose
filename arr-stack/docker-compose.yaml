services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - 8096:8096
    volumes:
      - /opt/appdata/jellyfin:/config
      - /media:/media
    devices:
      # Passthrough gfx (for Quick Sync)
      - /dev/dri:/dev/dri
    restart: unless-stopped

  services:
    metube:
      image: ghcr.io/alexta69/metube:latest
      container_name: metube
      ports:
        - 8081:8081
      volumes:
        - /mediaYouTube:/downloads 
      restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - 7878:7878
    volumes:
      - /opt/appdata/radarr:/config
      - /media:/media
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - 9696:9696
    volumes:
      - /opt/appdata/prowlarr:/config
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - WEBUI_PORT=8080
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - /opt/appdata/qbittorrent:/config
      - /media:/media
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - TZ=Europe/Warsaw
    ports:
      - 5055:5055
    volumes:
      - /opt/appdata/jellyseerr:/app/config
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - 8989:8989
    volumes:
      - /opt/appdata/sonarr:/config
      - /media:/media
    restart: unless-stopped

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - 6767:6767
    volumes:
      - /opt/appdata/bazarr:/config
      - /media:/media
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=Europe/Warsaw
    ports:
      - 8191:8191
    restart: unless-stopped